<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reference Desk</title>
  <meta name="description" content="A step-by-step workflow that turns your character, place and prop photos into reference sheets and realistic AI video prompts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E0E10'/%3E%3Cpath d='M8 13V8h5M19 8h5v5M24 19v5h-5M13 24H8v-5' fill='none' stroke='%23D4FF3F' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23D4FF3F'/%3E%3C/svg%3E">
  <script>try{var t=localStorage.getItem('refdesk.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="rail-top">
        <a class="brand" href="#" data-go="project" aria-label="Reference Desk home">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 12V6h6M20 6h6v6M26 20v6h-6M12 26H6v-6" /><circle cx="16" cy="16" r="3.5" /></svg>
          <span><strong>Reference Desk</strong><em id="projTitle">Untitled project</em></span>
        </a>
        <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="railBody">Steps</button>
      </div>
      <div class="rail-body" id="railBody">
        <div class="overall">
          <div class="overall-row"><span>Project progress</span><strong id="overallPct">0%</strong></div>
          <div class="overall-bar"><span id="overallBar"></span></div>
        </div>
        <nav aria-label="Workflow steps"><ol id="nav" class="nav"></ol></nav>
        <div class="rail-tools">
          <button class="tool" id="exportBtn">Save project file</button>
          <button class="tool" id="importBtn">Open project file</button>
          <button class="tool" id="themeBtn">Switch light / dark</button>
          <button class="tool tool-warn" id="resetBtn">New project</button>
          <p class="rail-note">Everything stays in this browser. Save a project file to move it to another device.</p>
        </div>
      </div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script src="js/prompts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
